version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
    ignore:
      # Major upgrades are tracked in docs/security/dependency-exceptions.md
      - dependency-name: "Marten"
        update-types: ["version-update:semver-major"]
      - dependency-name: "MassTransit*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/src/Mcp/Cikada.Mcp"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"