name: MCP CI

on:
  pull_request:
    branches:
      - main
    paths:
      - src/Mcp/**
      - docs/manuals/docs/**
      - .github/workflows/mcp-ci.yml

permissions:
  contents: read

jobs:
  mcp-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Mcp/Cikada.Mcp

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Mcp/Cikada.Mcp/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and test
        run: npm test

      - name: Index the manuals
        run: |
          npm run docs:index
          node -e "const m=require('./data/docs-manifest.json'); console.log(m); if(!(m.chunk_count>0)) process.exit(1)"

      # Build context is the repository root: the image indexes docs/manuals/docs at build time.
      - name: Docker build
        working-directory: ${{ github.workspace }}
        run: docker build -f src/Mcp/Cikada.Mcp/Dockerfile --build-arg GIT_SHA=${{ github.sha }} -t lkvitai-mes-mcp:ci .
