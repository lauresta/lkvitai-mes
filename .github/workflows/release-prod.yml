name: Release to Production

# Publishing a GitHub release builds every Cikada image with the release tag and
# then deploys that tag to production through deploy-prod.yml.
# The image list is the same as in build-and-push.yml: keep the two in sync.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: src/Modules/Warehouse/LKvitai.MES.Modules.Warehouse.Api/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/lkvitai-mes-warehouse-api
          - name: webui
            dockerfile: src/Modules/Warehouse/LKvitai.MES.Modules.Warehouse.WebUI/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/lkvitai-mes-warehouse-webui
          - name: portal-api
            dockerfile: src/Modules/Portal/LKvitai.MES.Modules.Portal.Api/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/lkvitai-mes-portal-api
          - name: portal-webui
            dockerfile: src/Modules/Portal/LKvitai.MES.Modules.Portal.WebUI/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/lkvitai-mes-portal-webui
          - name: sales-api
            dockerfile: src/Modules/Sales/LKvitai.MES.Modules.Sales.Api/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/lkvitai-mes-sales-api
          - name: sales-webui
            dockerfile: src/Modules/Sales/LKvitai.MES.Modules.Sales.WebUI/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/lkvitai-mes-sales-webui
          - name: frontline-api
            dockerfile: src/Modules/Frontline/LKvitai.MES.Modules.Frontline.Api/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/lkvitai-mes-frontline-api
          - name: frontline-webui
            dockerfile: src/Modules/Frontline/LKvitai.MES.Modules.Frontline.WebUI/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/lkvitai-mes-frontline-webui
          - name: scanning-api
            dockerfile: src/Modules/Scanning/LKvitai.MES.Modules.Scanning.Api/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/lkvitai-mes-scanning-api
          - name: scanning-webui
            dockerfile: src/Modules/Scanning/LKvitai.MES.Modules.Scanning.WebUI/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/lkvitai-mes-scanning-webui
          - name: shopfloor-api
            dockerfile: src/Modules/Shopfloor/LKvitai.MES.Modules.Shopfloor.Api/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/lkvitai-mes-shopfloor-api
          - name: shopfloor-webui
            dockerfile: src/Modules/Shopfloor/LKvitai.MES.Modules.Shopfloor.WebUI/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/lkvitai-mes-shopfloor-webui
          - name: finance-api
            dockerfile: src/Modules/Finance/LKvitai.MES.Modules.Finance.Api/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/lkvitai-mes-finance-api
          - name: finance-webui
            dockerfile: src/Modules/Finance/LKvitai.MES.Modules.Finance.WebUI/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/lkvitai-mes-finance-webui
          # Node service. Built from the repo root (default context) because the image also indexes docs/manuals/docs;
          # the context is filtered by src/Mcp/Cikada.Mcp/Dockerfile.dockerignore.
          - name: mcp
            dockerfile: src/Mcp/Cikada.Mcp/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/lkvitai-mes-mcp

    steps:
      - name: Validate release tag
        run: |
          if ! printf '%s' "${{ github.event.release.tag_name }}" | grep -Eq '^v?[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag '${{ github.event.release.tag_name }}' is not a Docker-safe version tag. Use tags like v0.1.1 or 0.1.1."
            exit 1
          fi

      - name: Checkout release code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=sha,prefix=,format=long

      - name: Capture release build metadata
        id: meta_build
        shell: bash
        run: |
          GIT_SHA="${GITHUB_SHA}"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "git_sha=${GIT_SHA}"
            echo "build_date=${BUILD_DATE}"
            echo "app_version=${{ github.event.release.tag_name }}"
            echo "release_tag=${{ github.event.release.tag_name }}"
            echo "branch_name=${{ github.event.release.tag_name }}"
            echo "pr_number="
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta_build.outputs.app_version }}
            RELEASE_TAG=${{ steps.meta_build.outputs.release_tag }}
            GIT_SHA=${{ steps.meta_build.outputs.git_sha }}
            BUILD_DATE=${{ steps.meta_build.outputs.build_date }}
            BRANCH_NAME=${{ steps.meta_build.outputs.branch_name }}
            PR_NUMBER=${{ steps.meta_build.outputs.pr_number }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}

  deploy-prod:
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-prod.yml
    with:
      image_tag: ${{ github.event.release.tag_name }}
    secrets: inherit
