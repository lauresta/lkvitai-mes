# /etc/rsyslog.d/90-victorialogs.conf
# Forward all syslog to VictoriaLogs (lkvitai-mon, syslog listener TCP 514).
# target: LAN hosts use 192.168.0.20 ; Contabo / remote PBS (outside LAN) use 10.11.12.13 (VPN).
# lkvitai-mon itself uses 127.0.0.1.
# The disk-assisted queue keeps local syslog unblocked when VictoriaLogs is down.
*.* action(
  type="omfwd"
  target="192.168.0.20"
  port="514"
  protocol="tcp"
  Template="RSYSLOG_SyslogProtocol23Format"
  TCP_Framing="octet-counted"
  action.resumeRetryCount="-1"
  action.resumeInterval="30"
  queue.type="LinkedList"
  queue.filename="vl_fwd"
  queue.maxDiskSpace="256m"
  queue.saveOnShutdown="on"
)