# /etc/rsyslog.d/91-mssql-imfile.conf  (lkvitai-mssql, 192.168.0.32)
# errorlog is plain UTF-8/ASCII. journald holds the same lines only as "blob data" (leading CR), so imfile is used.
# rsyslog runs as user syslog; it needs read access: `usermod -aG mssql syslog` (done 2026-11-28).
module(load="imfile")
input(type="imfile" File="/var/opt/mssql/log/errorlog" Tag="mssql-errorlog" Severity="info" Facility="local0" PersistStateInterval="200")