# /etc/rsyslog.d/91-postgresql-imfile.conf  (lkvitai-db, 192.168.0.34)
# syslog user is in group adm, which can read /var/log/postgresql (done, nothing changed in PostgreSQL).
module(load="imfile")
input(type="imfile" File="/var/log/postgresql/postgresql-16-main.log" Tag="postgresql" Severity="info" Facility="local0" PersistStateInterval="200")