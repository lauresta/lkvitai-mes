http:
  routers:
    # Old production address. Production lives at https://cikada.lauresta.com
    # (cikada.yml). Every request to the old hosts is redirected there
    # permanently with its path and query kept, so old bookmarks keep working
    # and these hosts no longer reach the production containers directly.
    # portal./warehouse./api.mes.lauresta.com have no DNS; they are listed so
    # nothing on this Traefik serves them either.
    mes-legacy-redirect:
      rule: "Host(`mes.lauresta.com`) || Host(`portal.mes.lauresta.com`) || Host(`warehouse.mes.lauresta.com`) || Host(`api.mes.lauresta.com`)"
      entryPoints: [websecure]
      middlewares: [mes-legacy-to-cikada]
      service: noop@internal
      priority: 1000
      tls:
        certResolver: letsencrypt

  middlewares:
    mes-legacy-to-cikada:
      redirectRegex:
        regex: "^https?://[^/]+(.*)$"
        replacement: "https://cikada.lauresta.com${1}"
        permanent: true
